name: AI Bubble Monitor
slug: ai_bubble_monitor
version: 0.23.9
description: Local AI risk monitor with explainable scenario scores
arch:
  - amd64
startup: application
init: false
boot: auto
ingress: true
ingress_port: 8099
ports:
  8099/tcp: 8100
ports_description:
  8099/tcp: Direct LAN connection or Cloudflare Tunnel origin; change host port if 8100 is in use
panel_icon: mdi:chart-line
panel_title: AI Bubble Monitor
panel_admin: false
options:
  log_level: info
  collection_interval_minutes: 60
  scoring_interval_minutes: 60
  auto_collection_enabled: true
  fred_api_key: ""
  fiscal_api_key: ""
  sec_user_agent: ""
  allow_direct_access: true
  historical_window_days: 1825
schema:
  log_level: list(debug|info|warning|error)
  collection_interval_minutes: int(15,1440)
  scoring_interval_minutes: int(15,1440)
  auto_collection_enabled: bool
  fred_api_key: password
  fiscal_api_key: password
  sec_user_agent: str
  allow_direct_access: bool
  historical_window_days: int(365,3650)

