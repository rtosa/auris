version: "0.10.0"
description: "Coverage-gated market, macroeconomic, liquidity, analyst revision, and filing-linked company evidence scores."
defaults:
  lookback_days: 1825
  minimum_observations: 60
  method: rolling_percentile
  source_confidence:
    fred: 0.95
    coinpaprika: 0.85
    proskauer: 0.70
    fiscalai: 0.75
    sec_event: 0.85
  minimum_coverage: 0.50
  maximum_reweight_factor: 2.0
  minimum_confidence: 0.60
  status_coverage_threshold: 0.80
  persistence_threshold: 60
  persistence_lookback_days: 30
  persistence_required_days: 20
  classifications:
    - {max: 19, label: Very low signal}
    - {max: 39, label: Low signal}
    - {max: 59, label: Moderate signal}
    - {max: 79, label: High signal}
    - {max: 100, label: Critical signal}
company_group_metrics:
  max_reporting_age_days: 550
  minimum_group_coverage: 0.5
  source_confidence: 0.9
  maturity_proxy_source_confidence: 0.65
  debt_maturity_ratio_cap: 1.0
  purchase_obligation_to_assets_ratio_cap: 0.5
scenarios:
  boom_continuation:
    name: AI Boom Continuation / Relief Rally
    components:
      - {id: equity_momentum, name: Equity momentum, weight: 0.25, direction: favorable, indicators: [sp500, nasdaq_composite]}
      - {id: ai_earnings_guidance, name: AI ecosystem earnings revisions and reported AI revenue growth, weight: 0.25, direction: risk, indicators: [analyst_revisions_risk, ai_monetization_growth_risk]}
      - {id: compute_demand, name: Reported Data Center revenue growth proxy, weight: 0.20, direction: risk, indicators: [ai_compute_revenue_growth_risk]}
      - {id: credit_conditions, name: Credit conditions, weight: 0.15, direction: favorable, indicators: [high_yield_oas, investment_grade_oas]}
      - {id: capex_continuation, name: Company balance-sheet resilience proxy, weight: 0.15, direction: favorable, indicators: [company_group:hyperscalers, company_group:semiconductors]}
  prolonged_repricing:
    name: Prolonged Repricing
    components:
      # Momentum remains capped at half weight until point-in-time valuation data is added.
      - {id: equity_valuation_momentum, name: Equity momentum proxy (valuation not covered), weight: 0.25, direction: risk, coverage_cap: 0.50, indicators: [sp500, nasdaq_composite]}
      - {id: capex_fcf_divergence, name: Company CAPEX / FCF and balance-sheet risk, weight: 0.25, direction: risk, indicators: [company_group:hyperscalers, company_group:neoclouds, company_group:semiconductors]}
      - {id: ai_monetization, name: Reported AI business revenue growth, weight: 0.20, direction: risk, indicators: [ai_monetization_growth_risk]}
      - {id: earnings_revisions, name: Point-in-time EPS and revenue consensus revisions, weight: 0.15, direction: risk, indicators: [analyst_revisions_risk]}
      - {id: interest_rates, name: Interest rates, weight: 0.15, direction: risk, indicators: [us_2y_yield, us_10y_yield, fed_funds_rate]}
  credit_crunch:
    name: AI Credit Crunch / Domino Effect
    components:
      - {id: neocloud_credit_stress, name: Neocloud credit stress proxy from SEC company scores, weight: 0.30, direction: risk, indicators: [company_group:neoclouds]}
      - {id: hyperscaler_credit_stress, name: Hyperscaler credit stress proxy from SEC company scores, weight: 0.20, direction: risk, indicators: [company_group:hyperscalers]}
      - {id: refinancing_risk, name: Debt maturing within 12 months proxy, weight: 0.20, direction: risk, indicators: [company_maturity_risk:neoclouds, company_maturity_risk:hyperscalers, company_maturity_risk:data_centers]}
      - {id: bank_lending_tightening, name: Bank lending tightening proxy, weight: 0.15, direction: risk, indicators: [bank_lending_tightening]}
      - {id: contractual_commitments, name: Unrecorded purchase obligations proxy, weight: 0.15, direction: risk, indicators: [company_commitment_risk:hyperscalers, company_commitment_risk:neoclouds, company_commitment_risk:data_centers]}
  macro_crisis:
    name: Macro Crisis / Stagflation
    components:
      - {id: inflation_rates, name: Inflation and interest rates, weight: 0.20, direction: risk, indicators: [cpi_index, fed_funds_rate, us_2y_yield]}
      - {id: financial_conditions, name: Financial conditions, weight: 0.20, direction: risk, indicators: [nfci, financial_stress_index]}
      - {id: equity_credit_stress, name: Equity and credit stress, weight: 0.20, direction: risk, indicators: [vix, sp500, nasdaq_composite, high_yield_oas, investment_grade_oas]}
      - {id: direct_liquidity, name: Direct liquidity conditions (Fed reserves, TGA, reverse repo), weight: 0.10, direction: risk, indicators: [fed_reserve_balances, treasury_general_account, overnight_reverse_repo]}
      - {id: dollar_strength, name: Trade-weighted USD strength proxy, weight: 0.05, direction: risk, coverage_cap: 0.50, indicators: [broad_us_dollar]}
      - {id: energy_prices, name: Energy prices, weight: 0.125, direction: risk, indicators: [wti_crude_oil, henry_hub_natural_gas]}
      - {id: economic_activity, name: Employment and industrial activity, weight: 0.125, direction: risk, indicators: [unemployment_rate, initial_jobless_claims, industrial_production]}
composites:
  fragility_index:
    name: AI Ecosystem Fragility Index
    min_coverage: 0.50
    max_reweight_factor: 2.0
    inputs:
      - {id: prolonged_repricing, name: Prolonged repricing, weight: 0.40}
      - {id: credit_crunch, name: Credit crunch, weight: 0.35}
      - {id: macro_crisis, name: Macro crisis, weight: 0.25}
  current_stress_index:
    name: Current Stress Index
    min_coverage: 0.50
    max_reweight_factor: 2.0
    components:
      - {id: equity_stress, name: Equity stress, weight: 0.30, direction: risk, indicators: [vix, sp500, nasdaq_composite, bitcoin_usd]}
      - {id: credit_stress, name: Credit stress, weight: 0.30, direction: risk, indicators: [high_yield_oas, investment_grade_oas, bank_lending_tightening]}
      - {id: macro_stress, name: Macro stress, weight: 0.25, direction: risk, indicators: [nfci, financial_stress_index]}
      - {id: direct_liquidity_stress, name: Direct liquidity conditions, weight: 0.10, direction: risk, indicators: [fed_reserve_balances, treasury_general_account, overnight_reverse_repo]}
      - {id: dollar_strength_stress, name: Trade-weighted USD strength proxy, weight: 0.05, direction: risk, coverage_cap: 0.50, indicators: [broad_us_dollar]}
